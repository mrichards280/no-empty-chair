<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KNOT — Book · Demo booking experience by No Empty Chair</title>
<meta name="description" content="A custom, mobile-first booking experience concept for a braid studio. Client books, studio sets the rules. Demo by No Empty Chair.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ece7df; --ink:#131311; --card:#f7f4ee; --white:#fff;
    --clay:#c25b3a; --olive:#5b6b3a; --butter:#e8b84b; --sky:#7fa8c9; --lilac:#b3a0d6;
    --muted:#6f6a60; --line:#d9d2c6;
    --ok:#5b6b3a; --warn:#c25b3a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{font-family:'Space Grotesk',sans-serif;color:var(--ink);
       background:repeating-linear-gradient(135deg,#e6e0d7,#e6e0d7 24px,#e9e3da 24px,#e9e3da 48px);
       line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .ser{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* NEC demo band across full width */
  .demo-band{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
    background:linear-gradient(135deg,rgba(233,185,196,.6),rgba(205,196,236,.55),rgba(190,221,203,.55));
    color:#413645;text-align:center;font-family:'Marcellus',serif;font-size:12px;letter-spacing:1.2px;
    padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.6);}

  /* PHONE FRAME */
  .app{width:100%;max-width:440px;background:var(--bg);min-height:100vh;position:relative;
       box-shadow:0 30px 80px rgba(19,19,17,.22);display:flex;flex-direction:column;overflow:hidden;}
  @media(min-width:480px){ .app{margin:22px 0;border-radius:34px;min-height:auto;height:calc(100vh - 90px);max-height:900px;} }

  /* TOP BAR */
  .bar{position:sticky;top:0;z-index:40;background:rgba(236,231,223,.9);backdrop-filter:blur(12px);
       border-bottom:1px solid var(--line);padding:14px 18px 10px;}
  .barrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
  .logo{font-weight:700;font-size:21px;letter-spacing:-1px;display:flex;align-items:center;gap:8px;}
  .logo .k{width:27px;height:27px;background:var(--ink);color:var(--bg);border-radius:8px;display:flex;
           align-items:center;justify-content:center;font-size:14px;transform:rotate(-6deg);font-weight:700;}
  .loc{font-size:11px;color:var(--muted);text-align:right;line-height:1.4;}
  /* segmented control */
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:3px;}
  .seg button{flex:1;padding:8px 6px;border-radius:100px;font-size:13px;font-weight:600;color:var(--muted);
              transition:.18s;display:flex;align-items:center;justify-content:center;gap:5px;}
  .seg button.on{background:var(--ink);color:var(--bg);}
  .seg .badge{background:var(--clay);color:#fff;font-size:10px;font-weight:700;border-radius:100px;
              min-width:16px;height:16px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;}
  .seg button.on .badge{background:var(--butter);color:var(--ink);}

  /* SCROLL AREA */
  .scroll{flex:1;overflow-y:auto;padding:18px 18px 120px;}
  .screen{display:none;} .screen.on{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:2px;
           text-transform:uppercase;color:var(--clay);margin-bottom:9px;}
  .eyebrow:before{content:"";width:20px;height:1.5px;background:var(--clay);}
  h1.big{font-size:38px;font-weight:700;letter-spacing:-2px;line-height:.95;margin-bottom:6px;}
  .sub{font-size:14px;color:var(--muted);margin-bottom:18px;}

  /* progress dots */
  .steps{display:flex;gap:6px;margin-bottom:16px;}
  .steps i{height:4px;flex:1;background:var(--line);border-radius:100px;transition:.25s;}
  .steps i.done{background:var(--clay);}

  /* SERVICE CARDS */
  .svc{display:flex;flex-direction:column;gap:11px;}
  .scard{display:flex;gap:13px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;
         padding:11px;align-items:center;transition:.15s;text-align:left;width:100%;}
  .scard:active{transform:scale(.99);}
  .scard.sel{border-color:var(--ink);background:#fff;}
  .scard .thumb{width:64px;height:64px;border-radius:13px;background-size:cover;background-position:center;flex:0 0 64px;background-color:var(--lilac);}
  .scard .sc-main{flex:1;min-width:0;}
  .scard h3{font-size:16px;font-weight:600;letter-spacing:-.3px;}
  .scard .dur{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .scard .price{font-size:16px;font-weight:700;white-space:nowrap;}
  .scard .off{opacity:.45;}
  .pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .chip{padding:9px 14px;border-radius:100px;border:1.5px solid var(--line);background:var(--card);
        font-size:13px;font-weight:600;color:var(--ink);transition:.15s;}
  .chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chip:disabled{opacity:.35;text-decoration:line-through;}
  .fieldlbl{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}

  /* ARTIST */
  .artist{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);
          border-radius:16px;padding:11px;width:100%;text-align:left;margin-bottom:10px;transition:.15s;}
  .artist.sel{border-color:var(--ink);background:#fff;}
  .artist .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
              color:#fff;font-weight:700;font-size:18px;flex:0 0 48px;}
  .artist .a-main{flex:1;} .artist h4{font-size:15px;font-weight:600;}
  .artist .spec{font-size:12px;color:var(--muted);}
  .artist .next{font-size:11px;font-weight:600;color:var(--olive);}

  /* DATE + TIME */
  .daterow{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;}
  .dchip{flex:0 0 auto;width:56px;padding:10px 0;border-radius:14px;border:1.5px solid var(--line);
         background:var(--card);text-align:center;transition:.15s;}
  .dchip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .dchip.off{opacity:.32;}
  .dchip .dow{font-size:11px;font-weight:600;text-transform:uppercase;}
  .dchip .dnum{font-size:19px;font-weight:700;line-height:1.1;}
  .dchip .mon{font-size:9px;text-transform:uppercase;color:var(--muted);}
  .dchip.sel .mon{color:var(--bg);opacity:.7;}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
  .slot{padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
        font-size:13px;font-weight:600;text-align:center;transition:.15s;}
  .slot.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px;background:var(--card);
         border:1px dashed var(--line);border-radius:14px;margin-top:6px;}

  /* REVIEW / SUMMARY */
  .sumcard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;}
  .sumline{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
  .sumline .k2{color:var(--muted);} .sumline b{font-weight:600;}
  .sumtot{border-top:1.5px solid var(--line);margin-top:8px;padding-top:12px;display:flex;
          justify-content:space-between;align-items:baseline;}
  .sumtot .big2{font-size:26px;font-weight:700;}
  .depo{background:var(--butter);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:500;
        display:flex;gap:9px;align-items:center;margin-bottom:14px;}
  .note{font-size:12px;color:var(--muted);margin-top:4px;}

  /* PRIMARY BTN + STICKY FOOTER */
  .foot{position:absolute;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
        background:linear-gradient(to top,var(--bg) 72%,rgba(236,231,223,0));display:flex;gap:10px;z-index:30;}
  .btn{flex:1;background:var(--ink);color:var(--bg);padding:15px;border-radius:100px;font-weight:700;
       font-size:15px;text-align:center;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(.98);} .btn:disabled{opacity:.4;}
  .btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto;padding:15px 20px;}
  .btn.clay{background:var(--clay);color:#fff;} .btn.butter{background:var(--butter);color:var(--ink);}

  /* CONFIRMATION */
  .done-wrap{text-align:center;padding:30px 6px;}
  .checkmk{width:82px;height:82px;border-radius:50%;background:var(--olive);margin:0 auto 20px;
           display:flex;align-items:center;justify-content:center;animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .done-wrap h1{font-size:34px;letter-spacing:-1.5px;margin-bottom:8px;}
  .status-pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
               padding:5px 13px;border-radius:100px;margin-bottom:14px;}
  .st-conf{background:var(--olive);color:#fff;} .st-req{background:var(--butter);color:var(--ink);}
  .st-cancel{background:#d9d2c6;color:var(--muted);} .st-declined{background:#e2c9c0;color:var(--warn);}

  /* MY VISITS */
  .otp{display:flex;gap:8px;margin:14px 0;}
  .otp input{flex:1;height:56px;text-align:center;font-size:22px;font-weight:700;border-radius:14px;
             border:1.5px solid var(--line);background:var(--card);}
  .vcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;}
  .vcard .vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .vcard h4{font-size:16px;font-weight:600;} .vcard .vmeta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .vcard .vact{display:flex;gap:8px;margin-top:12px;}
  .vcard .vbtn{flex:1;padding:9px;border-radius:100px;font-size:12.5px;font-weight:600;text-align:center;
               border:1.5px solid var(--line);background:var(--card);}
  .vcard .vbtn.dang{color:var(--warn);border-color:#e2c9c0;}

  /* STUDIO */
  .stnote{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:12.5px;
          margin-bottom:16px;line-height:1.5;}
  .stnote b{color:var(--butter);}
  .sttabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
  .sttab{flex:0 0 auto;padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;color:var(--muted);
         background:var(--card);border:1.5px solid var(--line);}
  .sttab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .stsec{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
  .stsec h4{font-size:14px;font-weight:600;margin-bottom:3px;}
  .stsec .h-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);}
  .toggle-row:first-of-type{border-top:none;}
  .toggle-row .tl{font-size:13.5px;font-weight:500;} .toggle-row .ts{font-size:11.5px;color:var(--muted);}
  .sw{width:44px;height:26px;border-radius:100px;background:var(--line);position:relative;transition:.2s;flex:0 0 44px;}
  .sw:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .sw.on{background:var(--olive);} .sw.on:after{left:21px;}
  .stepper{display:flex;align-items:center;gap:12px;}
  .stepper button{width:32px;height:32px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .stepper .val{font-size:15px;font-weight:700;min-width:56px;text-align:center;}
  .seg2{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:100px;padding:3px;margin-top:4px;}
  .seg2 button{flex:1;padding:8px;border-radius:100px;font-size:12.5px;font-weight:600;color:var(--muted);}
  .seg2 button.on{background:var(--ink);color:var(--bg);}
  .daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .daychip{width:40px;padding:8px 0;border-radius:10px;text-align:center;font-size:12px;font-weight:600;
           background:var(--card);border:1.5px solid var(--line);}
  .daychip.on{background:var(--olive);color:#fff;border-color:var(--olive);}
  .st-svc{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .st-svc:first-child{border-top:none;}
  .st-svc .sdot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;}
  .st-svc .sn{flex:1;font-size:13.5px;font-weight:500;} .st-svc .sp{font-size:13px;color:var(--muted);}
  .req-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
  .req-card .ra{display:flex;gap:8px;margin-top:10px;}
  .req-card .ra button{flex:1;padding:9px;border-radius:100px;font-size:12.5px;font-weight:700;}
  .req-card .ok{background:var(--olive);color:#fff;} .req-card .no{background:var(--card);color:var(--warn);border:1.5px solid #e2c9c0;}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pgrid .pc{aspect-ratio:1;border-radius:12px;background-size:cover;background-position:center;position:relative;overflow:hidden;border:1.5px solid var(--line);}
  .pgrid .pc .x{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(19,19,17,.7);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .pgrid .pc.hidden{opacity:.3;} .pgrid .pc.hidden .x{background:var(--olive);}
  .cal-day{margin-bottom:14px;} .cal-day .cd-h{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
  .cal-appt{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;}
  .cal-appt .ct{font-size:13px;font-weight:700;flex:0 0 62px;} .cal-appt .cn{flex:1;font-size:13px;}
  .cal-appt .cn small{color:var(--muted);display:block;font-size:11px;}

  /* toast */
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;
         background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:100px;font-size:13px;font-weight:600;
         z-index:99;transition:.3s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* mobile-forward action bar (client) */
  .mfbar{display:flex;gap:8px;margin-top:18px;}
  .mfbar a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:14px;
           font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--card);}
  .mfbar a.call{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;font-style:italic;line-height:1.5;}
</style>
</head>
<body>
<div class="demo-band">✦ Demo booking experience by No Empty Chair · client books, studio sets the rules · your real details swap right in</div>

<div class="app" id="app">
  <!-- TOP BAR -->
  <div class="bar">
    <div class="barrow">
      <div class="logo"><span class="k">K</span> KNOT</div>
      <div class="loc">Cascade Rd, Atlanta<br>Tue–Sat · 9a–9p</div>
    </div>
    <div class="seg" id="seg">
      <button data-tab="book" class="on">Book</button>
      <button data-tab="visits">My visits</button>
      <button data-tab="studio">Studio <span class="badge" id="reqBadge" style="display:none">0</span></button>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <!-- ============ BOOK ============ -->
    <div class="screen on" id="s-book"></div>
    <!-- ============ VISITS ============ -->
    <div class="screen" id="s-visits"></div>
    <!-- ============ STUDIO ============ -->
    <div class="screen" id="s-studio"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STATE  (in-memory — everything the "owner" controls lives here,
   and the client booking flow reads from it, so changes apply live)
   ============================================================ */
const CLD="https://res.cloudinary.com/djrmz717j/image/upload/c_fill,g_auto,ar_1:1,w_360,q_auto,f_auto/noemptychair/demos/knot/";
const img = n => CLD+n;

const state = {
  rules:{
    days:{0:{off:true},1:{off:true},2:{off:false},3:{off:false},4:{off:false},5:{off:false},6:{off:false}},
    open:9, close:21,          // studio hours (24h)
    bufferMin:30,              // gap between appointments
    leadHrs:4,                 // no bookings within N hours
    maxPerDay:3,               // max installs per artist per day
    approval:'instant',        // 'instant' | 'request'
    deposit:40, depositRequired:true,
  },
  services:[
    {id:'knotless', name:'Knotless Braids', dur:240, base:180, color:'var(--clay)', photo:'hero-1', active:true},
    {id:'cornrows', name:'Stitch Cornrows', dur:150, base:120, color:'var(--olive)', photo:'hero-2', active:true},
    {id:'boho',     name:'Boho / Goddess',  dur:300, base:220, color:'var(--sky)',  photo:'reel-3', active:true},
    {id:'passion',  name:'Passion Twists',  dur:210, base:160, color:'var(--lilac)',photo:'reel-4', active:true},
    {id:'kids',     name:"Kids' Styles",    dur:90,  base:70,  color:'var(--butter)',photo:'reel-5', active:true},
    {id:'takedown', name:'Takedown + Wash', dur:60,  base:45,  color:'var(--ink)',  photo:'reel-2', active:true},
  ],
  artists:[
    {id:'aisha', name:'Aisha', spec:'Knotless & boho specialist', color:'var(--clay)', active:true},
    {id:'toni',  name:'Toni',  spec:'Cornrows, twists & designs', color:'var(--olive)', active:true},
    {id:'renae', name:'Renae', spec:'Kids & protective styles', color:'var(--lilac)', active:true},
  ],
  lengths:[{k:'Bra',add:0},{k:'Waist',add:40},{k:'Hip',add:80}],
  sizes:[{k:'Small',add:30},{k:'Medium',add:0},{k:'Jumbo',add:0}],
  addons:[{k:'Wash & Prep',add:35},{k:'Bring my own hair',add:-15}],
  portfolio:{
    knotless:[{n:'hero-1',on:true},{n:'reel-3',on:true},{n:'reel-1',on:true}],
    cornrows:[{n:'hero-2',on:true},{n:'reel-2',on:true}],
    boho:[{n:'reel-3',on:true},{n:'reel-4',on:true}],
    passion:[{n:'reel-4',on:true},{n:'reel-5',on:true}],
  },
  appointments:[],   // seeded below
};

/* ---- date helpers (browser Date is fine here) ---- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmtTime(min){let h=Math.floor(min/60),m=min%60;const ap=h>=12?'p':'a';h=h%12;if(h===0)h=12;return h+(m?':'+String(m).padStart(2,'0'):'')+ap;}
function svc(id){return state.services.find(s=>s.id===id);}
function artist(id){return state.artists.find(a=>a.id===id);}

/* ---- seed a few appointments on the next couple open days ---- */
(function seed(){
  const today=new Date(); today.setHours(0,0,0,0);
  let placed=0, i=0;
  const plan=[
    {svc:'knotless',artist:'aisha',time:600,name:'Jasmine T.',phone:'4045550111'},

/* ============================================================
   SLOT ENGINE — the connective tissue.
   Owner rules + existing appointments decide what the client sees.
   ============================================================ */
function dayIsOpen(d){
  const dow=d.getDay();
  if(state.rules.days[dow].off) return false;
  return true;
}
function slotsFor(dateStr, serviceId, artistId){
  const d=parseYmd(dateStr);
  if(!dayIsOpen(d)) return [];
  const s=svc(serviceId); if(!s) return [];
  const {open,close,bufferMin,leadHrs,maxPerDay}=state.rules;
  // per-artist count that day
  const dayAppts=state.appointments.filter(a=>a.date===dateStr && a.artistId===artistId && a.status!=='Cancelled' && a.status!=='Declined');
  if(dayAppts.length>=maxPerDay) return [];
  const now=new Date();
  const leadMs=leadHrs*3600*1000;
  const out=[];
  // candidate starts hourly, must finish by close
  for(let start=open*60; start+s.dur<=close*60; start+=60){
    // lead time for today
    const slotDate=new Date(d); slotDate.setHours(0,0,0,0); slotDate.setMinutes(start);
    if(slotDate.getTime() < now.getTime()+leadMs) continue;
    // collision with existing appts for this artist (with buffer)
    const clash=dayAppts.some(a=>{
      const as=a.time, ae=a.time+svc(a.serviceId).dur+bufferMin;
      const bs=start,  be=start+s.dur+bufferMin;
      return bs<ae && as<be;
    });
    if(!clash) out.push(start);
  }
  return out;
}
function nextOpening(artistId,serviceId){
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<21;i++){const d=addDays(today,i);const sl=slotsFor(ymd(d),serviceId||'knotless',artistId);
    if(sl.length){return DOW[d.getDay()]+' '+fmtTime(sl[0]);}}
  return 'Ask for waitlist';
}

function draftTotal(){

  draft.addons.forEach(k=>{const a=state.addons.find(x=>x.k===k); if(a)t+=a.add;});
  return t;
}

  <div class="stsec"><h4>Your team</h4><div class="h-sub">Who's taking bookings.</div>
    ${state.artists.map(a=>`<div class="st-svc"><span class="sdot" style="background:${a.color}"></span>
      <span class="sn">${a.name}<div class="sp">${a.spec}</div></span>
      <div class="sw ${a.active?'on':''}" onclick="toggleArtist('${a.id}')"></div></div>`).join('')}
  </div>`;
}
function studioPhotos(){
  const ids=Object.keys(state.portfolio);
  return `<div class="stsec"><h4>Portfolio</h4><div class="h-sub">Tap a photo to show/hide it on the style. In your live build this is fully custom — your real work, your colors.</div>`
    +ids.map(id=>`<div style="margin-bottom:14px"><div class="fieldlbl" style="margin:6px 0 8px">${svc(id).name}</div>
      <div class="pgrid">${state.portfolio[id].map((p,i)=>`<div class="pc ${p.on?'':'hidden'}" style="background-image:url('${img(p.n)}')" onclick="togglePhoto('${id}',${i})"><span class="x">${p.on?'✓':'+'}</span></div>`).join('')}
      <div class="pc" style="display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted);font-size:26px" onclick="toast('Fully custom build — your real before/afters live here')">＋</div></div></div>`).join('')
    +`</div>`;
}
function studioRequests(){
  const reqs=pendingReqs();
  if(state.rules.approval!=='request'){
    return `<div class="stsec"><h4>Requests are off</h4><div class="h-sub">You're on <b>Instant book</b> — bookings confirm automatically. Switch to “Request &amp; approve” under Booking rules to vet each one.</div></div>`;}
  if(!reqs.length) return `<div class="empty">No pending requests.<br>New booking requests land here to approve or decline.</div>`;
  return reqs.map(a=>{const s=svc(a.serviceId),ar=artist(a.artistId),d=parseYmd(a.date);
    return `<div class="req-card"><h4 style="font-size:15px;font-weight:600">${a.name} · ${s.name}</h4>
      <div class="vmeta" style="font-size:12.5px;color:var(--muted)">${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()} · ${fmtTime(a.time)} · ${ar.name} · $${a.total}</div>
      <div class="ra"><button class="ok" onclick="decide('${a.id}',true)">Approve</button><button class="no" onclick="decide('${a.id}',false)">Decline</button></div></div>`;}).join('');
}
function studioBook(){
  const today=new Date();today.setHours(0,0,0,0);
  const days=[...Array(7)].map((_,i)=>addDays(today,i)).filter(d=>dayIsOpen(d));
  let h='';
  days.slice(0,5).forEach(d=>{
    const ds=ymd(d);
    const appts=state.appointments.filter(a=>a.date===ds && a.status!=='Cancelled' && a.status!=='Declined').sort((x,y)=>x.time-y.time);
    h+=`<div class="cal-day"><div class="cd-h">${DOW[d.getDay()]} · ${MON[d.getMonth()]} ${d.getDate()}${ds===ymd(today)?' · Today':''}</div>`;
    if(!appts.length){h+=`<div class="note" style="padding-left:2px">Open — no bookings yet.</div>`;}
    else appts.forEach(a=>{const s=svc(a.serviceId),ar=artist(a.artistId);
      h+=`<div class="cal-appt"><span class="ct">${fmtTime(a.time)}</span><span class="cn">${a.name} <small>${s.name} · ${ar.name} · ${durLabel(s.dur)}${a.status==='Requested'?' · ⏳ pending':''}</small></span></div>`;});
    h+=`</div>`;
  });
  return `<div class="stsec" style="padding:12px 14px">${h}</div>`;
}
/* studio actions */
function setRule(k,v){state.rules[k]=v; draft.time=null; renderStudio(); updateReqBadge();}
function bump(k,step){const lim={open:[6,20],close:[10,23],bufferMin:[0,90],leadHrs:[0,48],maxPerDay:[1,8],deposit:[0,200]};
  let v=state.rules[k]+step; const[lo,hi]=lim[k]; v=Math.max(lo,Math.min(hi,v));
  if(k==='open'&&v>=state.rules.close)v=state.rules.close-1; if(k==='close'&&v<=state.rules.open)v=state.rules.open+1;
  state.rules[k]=v; draft.time=null; draft.date=null; renderStudio();}
function toggleDay(i){state.rules.days[i].off=!state.rules.days[i].off; draft.date=null; draft.time=null; renderStudio();}
function toggleSvc(id){const s=svc(id);s.active=!s.active; if(draft.serviceId===id&&!s.active){draft.serviceId=null;} renderStudio();}
function toggleArtist(id){const a=artist(id);a.active=!a.active; renderStudio();}
function togglePhoto(id,i){state.portfolio[id][i].on=!state.portfolio[id][i].on; renderStudio();}
function decide(id,ok){const a=state.appointments.find(x=>x.id===id); if(!a)return; a.status=ok?'Confirmed':'Declined';
  toast(ok?'Approved ✓ client notified':'Declined · client notified'); renderStudio(); updateReqBadge();}

/* ============================================================
   TABS / ROUTER
   ============================================================ */
let currentTab='book';
function go(tab){
  currentTab=tab;
  [...document.getElementById('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.getElementById('s-book').classList.toggle('on',tab==='book');
  document.getElementById('s-visits').classList.toggle('on',tab==='visits');
  document.getElementById('s-studio').classList.toggle('on',tab==='studio');
  if(tab==='book')renderBook();
  if(tab==='visits')renderVisits();
  if(tab==='studio')renderStudio();
  renderFoot();
  document.getElementById('scroll').scrollTop=0;
}
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab);});

function updateReqBadge(){const n=pendingReqs().length;const b=document.getElementById('reqBadge');
  b.textContent=n; b.style.display=n?'inline-flex':'none';}

/* toast */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* init */
renderBook(); updateReqBadge();
</script>
</body>
